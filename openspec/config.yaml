schema: spec-driven

context: |
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Proyecto: Mi Cotizador, app de escritorio en Python (tkinter) para Windows,
  empaquetada con PyInstaller. Las cuentas viven en PocketBase (colección users,
  con rol y desactivado); la seguridad se impone con reglas de PocketBase
  definidas en pocketbase/pb_migrations/. Archivos principales: mi_cotizador.py
  y pocketbase_client.py.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
